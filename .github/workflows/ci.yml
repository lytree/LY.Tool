name: CI

# 持续集成：push / PR 时自动构建全部目标（host + SDK + plugin + tool），
# 仅验证编译通过，不发布产物、不推送 NuGet。
# 发布请使用 release-host.yml / release-plugins.yml / release-tool.yml。

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.mdx'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.mdx'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    name: Build All Targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build all (host + SDK + plugin + tool)
        run: |
          dotnet build/build.cs \
            --build=all \
            --configuration=Release

      - name: Test core
        run: dotnet test tests/LYBox.Tests/LYBox.Tests.csproj -c Release --results-directory artifacts/test-results

      - name: Verify artifacts
        run: |
          echo "=== SDK NuGet packages ==="
          ls -lh artifacts/packages/sdk/*.nupkg 2>/dev/null || echo "(none)"
          echo "=== Plugin zips ==="
          ls -lh artifacts/packages/plugins/*.zip 2>/dev/null || echo "(none)"
          echo "=== Tool NuGet packages ==="
          ls -lh artifacts/packages/tools/*.nupkg 2>/dev/null || echo "(none)"
          echo "=== Launcher publish ==="
          find artifacts/publish/launcher -maxdepth 3 -type f | sort | head -50

      - name: Upload SDK NuGet artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-sdk-nuget
          path: artifacts/packages/sdk/*.nupkg
          if-no-files-found: warn
          retention-days: 3

      - name: Upload plugin zip artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-plugin-zips
          path: artifacts/packages/plugins/*.zip
          if-no-files-found: warn
          retention-days: 3

      - name: Upload tool NuGet artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-tool-nuget
          path: artifacts/packages/tools/*.nupkg

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-test-results
          path: artifacts/test-results/**
          if-no-files-found: warn
          retention-days: 3
